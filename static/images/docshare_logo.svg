<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Logo DocShare</title>
<desc>Logo DocShare avec icône de document et texte stylisé</desc>

<defs>
  <clipPath id="clip1">
    <rect x="0" y="0" width="680" height="200" rx="12"/>
  </clipPath>
</defs>

<!-- Icône document principal -->
<rect x="200" y="40" width="64" height="80" rx="6" fill="#1565C0"/>
<polygon points="240,40 264,40 264,64" fill="#0d47a1"/>
<rect x="210" y="72" width="44" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
<rect x="210" y="83" width="44" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
<rect x="210" y="94" width="32" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>

<!-- Icône document arrière gauche -->
<rect x="183" y="52" width="56" height="72" rx="6" fill="#43A047" opacity="0.25"/>

<!-- Icône document arrière droit -->
<rect x="217" y="48" width="56" height="72" rx="6" fill="#1565C0" opacity="0.15"/>

<!-- Flèche upload / partage -->
<circle cx="232" cy="148" r="14" fill="#43A047"/>
<line x1="232" y1="155" x2="232" y2="143" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="226,149 232,143 238,149" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Texte "Doc" -->
<text x="290" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#1565C0" letter-spacing="-1">Doc</text>

<!-- Texte "Share" -->
<text x="390" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#43A047" letter-spacing="-1">Share</text>

<!-- Tagline -->
<text x="291" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#888888" letter-spacing="2">PARTAGEZ · LISEZ · APPRENEZ</text>

<!-- Ligne décorative sous le texte -->
<rect x="291" y="138" width="180" height="3" rx="1.5" fill="#1565C0" opacity="0.15"/>
<rect x="291" y="138" width="60" height="3" rx="1.5" fill="#1565C0"/>
<rect x="355" y="138" width="60" height="3" rx="1.5" fill="#43A047"/>

</svg>
